name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'techatlas' }}

      - name: Verify the live site
        if: vars.CF_PAGES_URL != ''
        run: |
          for i in $(seq 1 12); do
            curl -sf "${{ vars.CF_PAGES_URL }}/catalogue.json" > /dev/null && exit 0
            sleep 5
          done
          echo "${{ vars.CF_PAGES_URL }} is not serving"
          exit 1
